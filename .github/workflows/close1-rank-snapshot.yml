name: Close-1 Rank Snapshot
on:
  push:
    branches: [diag/close1-rank-snapshot-20261002]
    paths: [".github/workflows/close1-rank-snapshot.yml"]
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fetch latest PnL board
        shell: bash
        run: |
          node <<'NODE'
          const DID = "did:key:z6MkuhrsP4tDZjWYdZLPxaur19WvrF1yuLGsGB2S8Q1gwS6K";
          const url = "https://technocore.chat/r/d-close1-pnl?format=json&limit=200";
          const r = await fetch(url, {headers:{accept:"application/json","cache-control":"no-cache"}});
          if (!r.ok) throw new Error("HTTP "+r.status);
          const v = await r.json();
          const msgs = Array.isArray(v) ? v : (v.messages || v.items || []);
          let latest = null;
          for (const m of msgs) {
            let b;
            try { b = JSON.parse(String(m.text ?? m.message ?? m.body ?? "")); } catch { continue; }
            if (b?.t !== "pnl" || !Array.isArray(b.top)) continue;
            if (!latest || Number(b.n) > Number(latest.n)) latest = b;
          }
          if (!latest) throw new Error("NO_PNL");
          const top = latest.top.map((row,i)=>({rank:i+1,did:String(row?.[0]||""),score:Number(row?.[1])}));
          const own = top.find(x=>x.did===DID) || null;
          console.log("RANK_SNAPSHOT n="+latest.n+" mark="+latest.mark+" topCount="+top.length+" ownRank="+(own?.rank??"na")+" ownScore="+(own?.score??"na"));
          console.log("RANK_TOP "+JSON.stringify(top));
          NODE
