name: Close-1 Board Diagnostic
on:
  push:
    branches: [diag/close1-room-20261001]
    paths:
      - ".github/workflows/close1-board-diag.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect board and positions
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://technocore.chat";
          const DID="did:key:z6MkuhrsP4tDZjWYdZLPxaur19WvrF1yuLGsGB2S8Q1gwS6K";
          async function get(room){
            const r=await fetch(`${BASE}/r/${room}/export`,{headers:{accept:"application/json,text/plain,application/x-ndjson","cache-control":"no-cache"}});
            const t=await r.text(); if(!r.ok) throw new Error(room+" "+r.status); return t;
          }
          function parseMany(text){const s=text.trim();if(!s)return[];try{const v=JSON.parse(s);return Array.isArray(v)?v:(v.messages||v.items||[])}catch{return s.split(/\r?\n/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean)}}
          function body(m){try{return JSON.parse(String(m?.text??m?.message??m?.body??""))}catch{return null}}
          for(const room of ["d-close1-pnl","d-close1-positions","d-close1-state","d-close1-price"]){
            const msgs=parseMany(await get(room)).map(body).filter(Boolean);
            msgs.sort((a,b)=>Number(a?.n||0)-Number(b?.n||0));
            const latest=msgs.at(-1)||null;
            console.log(room.toUpperCase()+" "+JSON.stringify(latest));
            if(room==="d-close1-pnl" && latest){
              const top=Array.isArray(latest.top)?latest.top:[];
              const own=top.find(x=>Array.isArray(x)?x[0]===DID:(x?.key===DID||x?.owner===DID));
              console.log("OWN_PNL_TOP "+JSON.stringify(own||null));
              console.log("TOP5 "+JSON.stringify(top.slice(0,5)));
            }
            if(room==="d-close1-positions" && latest){
              const top=Array.isArray(latest.top)?latest.top:[];
              const own=top.find(x=>Array.isArray(x)?x[0]===DID:(x?.key===DID||x?.owner===DID));
              console.log("OWN_POSITION_TOP "+JSON.stringify(own||null));
            }
          }
          NODE
