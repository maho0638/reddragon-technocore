name: Close-1 RedDragon Trader
# Watched by close1-watchdog.yml

on:
  push:
    branches: [main]
    paths:
      - "scripts/close1-trader-runner.mjs"
      - "scripts/close1-strategy.enc.json"
      - ".github/workflows/close1-trader.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close1-reddragon-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Evaluate Close-1 strategy
        env:
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOSE1_EXECUTE: "true"
          CLOSE1_STATE_SELFTEST: "false"
          CLOSE1_LOOP_COUNT: ${{ github.event_name == 'workflow_dispatch' && '10' || '1' }}
        shell: bash
        run: |
          set -euo pipefail
          count="${CLOSE1_LOOP_COUNT:-1}"
          for i in $(seq 1 "$count"); do
            echo "CLOSE1_LOOP=$i/$count"
            node scripts/close1-trader-runner.mjs
            if [[ "$i" -lt "$count" ]]; then
              sleep 300
            fi
          done
