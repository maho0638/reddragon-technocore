name: FLOP registry-bound read-only readiness
on:
  push:
    branches: ['prep/flop-testnet-did-20261107', 'work/flop-inference']
    paths:
      - '.github/workflows/flop-registry-readiness.yml'
      - 'scripts/flop-registry-readiness.mjs'
      - 'scripts/flop-miner-proof.mjs'
      - 'scripts/flop-miner-readiness.mjs'
      - 'scripts/flop-miners.mjs'
      - 'scripts/flop-spend.mjs'
      - 'scripts/flop-spend-sdk.mjs'
      - 'scripts/flop-spend.test.mjs'
      - 'scripts/flop-github-journal*.mjs'
      - 'scripts/flop-external-runner.mjs'
      - 'scripts/flop-sdk/package*.json'
      - '.github/workflows/flop-inference-approved.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run unsigned and mock regression tests
        run: node --test scripts/flop-agent-preflight.test.mjs scripts/flop-spend.test.mjs scripts/flop-github-journal.test.mjs
      - name: Verify exact SDK and run read-only readiness integration
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          cp "$GITHUB_WORKSPACE"/scripts/{flop-registry-readiness,flop-miner-proof,flop-miner-readiness,flop-miners,flop-spend,flop-spend-sdk,flop-external-runner,flop-github-journal}.mjs .
          cp "$GITHUB_WORKSPACE"/scripts/flop-sdk/package{,-lock}.json .
          node -e "if (require('./package-lock.json').packages['node_modules/@flop-labs/sdk'].integrity !== 'sha512-L2dhuXIabTqAH9a76jnO6Zzr5eDDcX4HRsrJX9r8O9rKRC7gpSfLUdfi6dVfH51AVuQAu5EBMm4xEebG2BoAgg==') process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('./flop-external-runner.mjs')"
          node --check flop-registry-readiness.mjs
          node flop-registry-readiness.mjs
