name: FLOP existing signer encrypted-keystore read-only check
on:
  push:
    branches: ['prep/flop-testnet-did-20261107']
    paths:
      - '.github/workflows/flop-signer-keystore-readonly.yml'
      - 'scripts/flop-signer-keystore-readonly.mjs'
      - 'scripts/flop-testnet-first-claim.mjs'
permissions: {}
jobs:
  signer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned setup-node
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact official CLI release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flop-cli"
          cd "$RUNNER_TEMP/flop-cli"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @flop-labs/cli@0.10.2 >/dev/null
      - name: Check the existing signer without sending a transaction
        env:
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          FLOP_CLI_PATH: ${{ runner.temp }}/flop-cli/node_modules/.bin/flop
        run: |
          set -euo pipefail
          node --check scripts/flop-signer-keystore-readonly.mjs
          node scripts/flop-signer-keystore-readonly.mjs
