name: RedDragon Technocore Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/technocore-agent.yml"
      - ".github/workflows/technocore-agent-backup.yml"
      - "scripts/technocore-agent.mjs"
      - "public/reddragon-contribution.json"
      - "package.json"
  schedule:
    # Primary off-minute cadence. GitHub scheduled runs can be delayed, so a
    # separate backup workflow runs on the alternating quarter-hour slots.
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: reddragon-technocore-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run RedDragon Technocore agent
        env:
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          TECHNOCORE_AGENT_ROOM: ${{ vars.TECHNOCORE_AGENT_ROOM || 'lobby' }}
          TECHNOCORE_AGENT_MESSAGE: ${{ vars.TECHNOCORE_AGENT_MESSAGE || 'RedDragon agent check-in' }}
          TECHNOCORE_MIN_POST_HOURS: ${{ vars.TECHNOCORE_MIN_POST_HOURS || '12' }}
          TECHNOCORE_POST_ENABLED: ${{ vars.TECHNOCORE_POST_ENABLED != 'false' && 'true' || 'false' }}
        shell: bash
        run: |
          # The script retries individual HTTP calls internally. This outer retry
          # absorbs short Technocore 5xx/network outages without hiding persistent
          # secret/config/code failures.
          status=1
          for attempt in 1 2 3; do
            echo "Primary agent attempt ${attempt}/3"
            node scripts/technocore-agent.mjs && exit 0
            status=$?

            if [ "$attempt" -eq 3 ]; then
              echo "Primary agent failed after 3 attempts (exit ${status})."
              exit "$status"
            fi

            wait_seconds=$((attempt * 20))
            echo "Attempt ${attempt} failed; waiting ${wait_seconds}s before retry."
            sleep "$wait_seconds"
          done

          exit "$status"
