name: FLOP public SDK readiness and chain checks
on:
  push:
    branches: ['prep/flop-testnet-did-20261107']
    paths: ['.github/workflows/flop-sdk-chain-readiness.yml']
permissions: {}
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify signed miner proof and finalized chain state without wallet secret
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm pack @flop-labs/sdk@0.13.1 --ignore-scripts --silent
          test "$(openssl dgst -sha512 -binary flop-labs-sdk-0.13.1.tgz | openssl base64 -A)" = 'L2dhuXIabTqAH9a76jnO6Zzr5eDDcX4HRsrJX9r8O9rKRC7gpSfLUdfi6dVfH51AVuQAu5EBMm4xEebG2BoAgg=='
          tar -xzf flop-labs-sdk-0.13.1.tgz
          echo '=== SDK proof verifier ==='
          sed -n '190,270p' package/dist/miner-admission.js
          echo '=== force-open call and SDK identity resolver ==='
          grep -A42 'async forceOpen(' package/dist/compute-channel/chain.js | head -48 || true
          grep -R -n -m 3 'async function createDirectSessionRuntime\|async resolveIdentity\|const resolveIdentity\|function resolve.*ModelIdentity' package/dist/compute-channel/*.js | cut -c1-500 | head -20 || true
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const miners=[['m14','https://m14.floptest.xyz','5Cm99adrc7guxVoT6YnC7LxUmmVgPamRsw9nVifRA9NUwDmd'],['antju2','https://antju2.5-am.fr','5E7UL5m78rSv2wkbijywrbCL94sE1NswpVCTtYT4dRZZtEA5']];
          for(const [name,endpoint,miner] of miners){try{
            const challenge=randomBytes(32).toString('hex');
            const r=await fetch(endpoint+'/session/info-proof',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({challenge}),redirect:'error',credentials:'omit',signal:AbortSignal.timeout(15000)});
            const raw=await r.text();const p=JSON.parse(raw);if(raw.length>65536)throw Error('body cap');
            const out={name,miner,http:r.status,challenge,proof:r.status===200?{genesis_hash:p.genesis_hash,account_id:p.account_id,enclave_key:p.enclave_key,model_identity:p.model_identity,ready:p.ready,image:p.image,signature:p.signature}:undefined,error:r.status!==200?String(p.error??'').slice(0,150):undefined};
            console.log('SIGNED_PUBLIC_PROOF='+JSON.stringify(out));
          }catch(e){console.log('PROOF_ERROR='+JSON.stringify({name,message:e.message?.slice(0,150)}));}}
          NODE
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact ./flop-labs-sdk-0.13.1.tgz > /dev/null
          node --input-type=module <<'NODE'
          import { ApiPromise,WsProvider } from '@polkadot/api';
          import * as sdk from '@flop-labs/sdk';
          import { randomBytes } from 'node:crypto';
          import {decodeAddress,cryptoWaitReady} from '@polkadot/util-crypto';
          const genesis='0x918abd58fb16306b30ef3886514cfaebffecb4de43e82b6f8ec4795c43cfd800',address='5HBqG8RN2WMPKhwq4AfGEPRBGsn82JQc28JU5pKCYW2QZFtW',miner='5Cm99adrc7guxVoT6YnC7LxUmmVgPamRsw9nVifRA9NUwDmd',channel='0xe58f3f1026a23f4f023255eb85dfae6b56fb0b6d3317f889fbb15c463e95da7f';
          let api;
          try{
            await cryptoWaitReady();
            console.log('SDK_PUBLIC_EXPORTS='+JSON.stringify(Object.keys(sdk).filter(x=>/modelIdentity|identityHash|InfoProof|connect|DirectSession/i.test(x))));
            api=await ApiPromise.create({provider:new WsProvider('wss://testnet.flop.network/'),noInitWarn:true});
            if(api.genesisHash.toHex()!==genesis)throw Error('genesis mismatch');
            const hash=await api.rpc.chain.getFinalizedHead(),at=await api.at(hash);
            const account=await at.query.system.account(address);
            const minerData=await at.query.minerStaking.miners(miner);
            const cap=await at.query.hwCalibration.benchmarkBurstCaps(miner);
            const old=await at.query.computeChannel.channels(channel);
            const rate=await at.query.computeChannel.minerCapacityReservationRate(miner);
            const fee=api.consts.computeChannel.unconsentedReservationTariff;
            console.log('FINALIZED_READ='+JSON.stringify({hash:hash.toHex(),runtime:api.runtimeVersion.specVersion.toString(),account:account.toJSON(),miner:minerData.toJSON(),cap:cap.toJSON(),oldChannel:old.toJSON(),rate:rate.toJSON(),tariff:fee.toString(),existential:api.consts.balances.existentialDeposit.toString()}));
            const proof=await sdk.fetchSessionInfoProof('https://m14.floptest.xyz',randomBytes(32));
            console.log('SDK_PROOF_READY='+JSON.stringify({ready:proof.ready,genesis:proof.genesis_hash,account:proof.account_id,key:proof.enclave_key,identity:proof.model_identity}));
          }catch(e){console.log('FINALIZED_READ_ERROR='+String(e.message).slice(0,240));process.exitCode=1;}finally{await api?.disconnect();}
          NODE
