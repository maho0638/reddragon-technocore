name: Close-1 Leader Probe
on:
  push:
    branches: [main]
    paths:
      - "scripts/close1-leader-probe.mjs"
      - ".github/workflows/close1-leader-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check trader syntax
        run: node --check scripts/close1-trader-runner.mjs
      - run: node scripts/close1-leader-probe.mjs
