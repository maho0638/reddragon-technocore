name: Close-1 Fee Hurdle Test
on:
  push:
    branches: [fix/close1-fallback-fee-hurdle-20261001]
    paths:
      - "scripts/close1-trader-runner.mjs"
      - ".github/workflows/close1-fee-hurdle-test.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Selftest
        env:
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOSE1_EXECUTE: "false"
          CLOSE1_STATE_SELFTEST: "false"
          CLOSE1_RACE_SELFTEST: "true"
        run: node scripts/close1-trader-runner.mjs
      - name: Dry run
        env:
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOSE1_EXECUTE: "false"
          CLOSE1_STATE_SELFTEST: "false"
          CLOSE1_RACE_SELFTEST: "false"
        run: node scripts/close1-trader-runner.mjs
