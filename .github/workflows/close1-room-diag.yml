name: Close-1 Room Diagnostic
on:
  push:
    branches: [diag/close1-room-20261001]
    paths:
      - ".github/workflows/close1-room-diag.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read public Close-1 room
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://technocore.chat";
          const DID="did:key:z6MkuhrsP4tDZjWYdZLPxaur19WvrF1yuLGsGB2S8Q1gwS6K";
          async function get(url){
            const r=await fetch(url,{headers:{accept:"application/json,text/plain,application/x-ndjson","cache-control":"no-cache"}});
            const t=await r.text();
            if(!r.ok) throw new Error(url+" HTTP "+r.status+" "+t.slice(0,200));
            return t;
          }
          function messagesFrom(value){
            if(Array.isArray(value)) return value;
            if(Array.isArray(value?.messages)) return value.messages;
            if(Array.isArray(value?.items)) return value.items;
            return [];
          }
          function parseMany(text){
            const s=text.trim(); if(!s) return [];
            try{return messagesFrom(JSON.parse(s));}catch{}
            return s.split(/\r?\n/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean);
          }
          function body(m){try{return JSON.parse(String(m?.text??m?.message??m?.body??""))}catch{return null}}
          const room=parseMany(await get(BASE+"/r/close1/export"));
          const ours=[];
          for(const m of room){
            const b=body(m), t=b?.terms;
            if(b?.t!=="trade"||!t) continue;
            if(String(t.maker||"")!==DID && String(b.taker||"")!==DID) continue;
            ours.push({
              seq:Number(m?.seq||0), id:String(t.id||""), side:String(t.side||""),
              qty:String(t.qty||""), px:String(t.px||""), until:Number(t.until||0),
              maker:String(t.maker||""), taker:String(b.taker||""),
              accepted:Boolean(b.taker_sig), season:String(b.season||"")
            });
          }
          ours.sort((a,b)=>a.seq-b.seq);
          console.log("REDDRAGON_RECENT_TRADES "+JSON.stringify(ours.slice(-15)));

          const price=parseMany(await get(BASE+"/r/d-close1-price/export"));
          const snaps=[];
          for(const m of price){
            const b=body(m);
            if(b?.t==="price"&&Number.isFinite(Number(b.n))) snaps.push({n:Number(b.n),px:String(b?.ref?.px||""),time:String(b?.ref?.time||"")});
          }
          snaps.sort((a,b)=>a.n-b.n);
          console.log("LATEST_REF "+JSON.stringify(snaps.at(-1)||null));

          const TARGET="fcl01-139113";
          const flow=parseMany(await get(BASE+"/r/d-close1-flow/export"));
          const hits=[];
          let latestFlow=null;
          for(const m of flow){
            const b=body(m);
            if(b?.t!=="flow") continue;
            if(!latestFlow || Number(b.n)>Number(latestFlow.n)) latestFlow=b;
            if(Array.isArray(b.settled)&&b.settled.includes(TARGET)) hits.push({n:Number(b.n),outcome:"settled"});
            if(Array.isArray(b.void)){
              const v=b.void.find(x=>Array.isArray(x)&&String(x[0])===TARGET);
              if(v) hits.push({n:Number(b.n),outcome:"void",reason:String(v[1]||"")});
            }
          }
          console.log("TARGET_FLOW "+JSON.stringify({target:TARGET,hits,latest:latestFlow?{n:Number(latestFlow.n),omitted:latestFlow.omitted||null}:null}));

          const pnl=parseMany(await get(BASE+"/r/d-close1-pnl/export"));
          const oursPnl=[];
          for(const m of pnl){
            const b=body(m);
            if(b?.t!=="pnl"||!Array.isArray(b.top)) continue;
            const hit=b.top.find(x=>Array.isArray(x)&&String(x[0])===DID);
            if(hit) oursPnl.push({n:Number(b.n),row:hit,mark:String(b.mark||"")});
          }
          console.log("OUR_PNL_TOP "+JSON.stringify(oursPnl.slice(-5)));
          NODE
