name: RedDragon Technocore Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/technocore-agent.yml"
      - "scripts/technocore-agent.mjs"
      - "package.json"
  schedule:
    # Frequent read/heartbeat run. Offset from :00/:30 to reduce GitHub cron congestion.
    - cron: "17,47 * * * *"
    # Exactly two signed activity windows per day (UTC), kept separate from heartbeat runs.
    - cron: "23 0,12 * * *"

permissions:
  contents: read

concurrency:
  group: reddragon-technocore-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run RedDragon Technocore agent
        env:
          # DID is derived from the Ed25519 private key at runtime. Forks need only this one secret.
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TECHNOCORE_PRIVATE_KEY_PKCS8_B64 }}
          TECHNOCORE_AGENT_ROOM: ${{ vars.TECHNOCORE_AGENT_ROOM || 'lobby' }}
          TECHNOCORE_AGENT_MESSAGE: ${{ vars.TECHNOCORE_AGENT_MESSAGE || 'RedDragon agent check-in' }}
          TECHNOCORE_MIN_POST_HOURS: ${{ vars.TECHNOCORE_MIN_POST_HOURS || '12' }}
          # Push/manual/heartbeat runs are read/heartbeat-only. Signed posting occurs only on the dedicated cron.
          TECHNOCORE_POST_ENABLED: ${{ vars.TECHNOCORE_POST_ENABLED != 'false' && github.event.schedule == '23 0,12 * * *' && 'true' || 'false' }}
        run: node scripts/technocore-agent.mjs
