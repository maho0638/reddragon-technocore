name: FLOP one-shot approved Testnet inference
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the reviewed development revision
        required: true
        type: string
      miner:
        description: Miner ID from fresh read-only readiness
        required: true
        type: string
      runtime:
        description: Runtime specVersion from fresh read-only readiness
        required: true
        type: string
      approval:
        description: Use probe-no-spend, probe-journal, or one-testnet-inference
        required: true
        type: string
permissions: {}
concurrency:
  group: reddragon-flop-testnet-payer
  cancel-in-progress: false
jobs:
  approval-probe:
    if: github.ref == 'refs/heads/main' && github.repository == 'maho0638/reddragon-technocore' && github.run_attempt == '1' && inputs.approval == 'probe-no-spend'
    environment: flop-inference-approved
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm the approval gate released this job
        run: printf '%s\n' 'Approval probe completed without signing or network writes.'
  journal-probe:
    if: github.ref == 'refs/heads/main' && github.repository == 'maho0638/reddragon-technocore' && github.run_attempt == '1' && inputs.approval == 'probe-journal'
    environment: flop-inference-approved
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Verify live journal writes with a dummy file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          api="repos/$GITHUB_REPOSITORY/contents/probes/journal-${GITHUB_RUN_ID}.json"
          # Keep probe markers separate from the real one-shot reservation.
          create="$(printf '%s' '{"probe":true,"stage":"reserved"}' | base64 -w0)"
          append="$(printf '%s' '{"probe":true,"stage":"updated"}' | base64 -w0)"
          sha="$(gh api --method PUT "$api" -f branch=flop-inference-state -f message='Reserve unsigned journal probe' -f content="$create" --jq .content.sha)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          if duplicate="$(gh api --method PUT "$api" -f branch=flop-inference-state -f message='Check unsigned reservation conflict' -f content="$create" 2>&1)"; then
            echo 'Duplicate reservation unexpectedly succeeded.'
            exit 1
          fi
          [[ "$duplicate" =~ HTTP\ (409|422) ]]
          updated="$(gh api --method PUT "$api" -f branch=flop-inference-state -f message='Advance unsigned journal probe' -f content="$append" -f sha="$sha" --jq .content.sha)"
          [[ "$updated" =~ ^[a-f0-9]{40}$ && "$updated" != "$sha" ]]
          [[ "$(gh api "$api" -f ref=flop-inference-state --method GET --jq .sha)" == "$updated" ]]
  spend:
    if: github.ref == 'refs/heads/main' && github.repository == 'maho0638/reddragon-technocore' && github.run_attempt == '1' && inputs.approval == 'one-testnet-inference'
    environment: flop-inference-approved
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FLOP_REVIEWED_COMMIT: ${{ vars.FLOP_REVIEWED_COMMIT }}
    steps:
      - name: Validate reviewed revision
        env:
          FLOP_REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          [[ "$FLOP_REVIEWED_COMMIT" =~ ^[a-f0-9]{40}$ && "$FLOP_REQUESTED_COMMIT" == "$FLOP_REVIEWED_COMMIT" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.FLOP_REVIEWED_COMMIT }}
          persist-credentials: false
      - name: Verify and stage the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FLOP_REVIEWED_COMMIT"
          node --test scripts/flop-agent-preflight.test.mjs scripts/flop-spend.test.mjs scripts/flop-github-journal.test.mjs
          stage="$(mktemp -d)"
          cp scripts/{flop-external-runner,flop-github-journal,flop-spend-sdk,flop-spend,flop-miner-readiness,flop-miner-proof,flop-miners}.mjs "$stage/"
          cp scripts/flop-sdk/package{,-lock}.json "$stage/"
          cd "$stage"
          node -e "if (require('./package-lock.json').packages['node_modules/@flop-labs/sdk'].integrity !== 'sha512-L2dhuXIabTqAH9a76jnO6Zzr5eDDcX4HRsrJX9r8O9rKRC7gpSfLUdfi6dVfH51AVuQAu5EBMm4xEebG2BoAgg==') process.exit(1)"
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "await import('./flop-external-runner.mjs')"
          printf 'FLOP_STAGE=%s\n' "$stage" >> "$GITHUB_ENV"
      - name: Execute one approved Testnet inference
        env:
          FLOP_EXPECTED_MINER: ${{ inputs.miner }}
          FLOP_EXPECTED_RUNTIME: ${{ inputs.runtime }}
          FLOP_RUN_APPROVAL: ${{ inputs.approval }}
          TECHNOCORE_PRIVATE_KEY_PKCS8_B64: ${{ secrets.FLOP_INFERENCE_SIGNER_PKCS8_B64 }}
          FLOP_JOURNAL_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : "${TECHNOCORE_PRIVATE_KEY_PKCS8_B64:?Missing dedicated inference environment signer}"
          node "$FLOP_STAGE/flop-external-runner.mjs"
