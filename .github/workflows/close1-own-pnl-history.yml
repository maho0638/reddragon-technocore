name: Close-1 Own PnL History
on:
  push:
    branches: [diag/close1-room-20261001]
    paths:
      - ".github/workflows/close1-own-pnl-history.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Find RedDragon on historical boards
        shell: bash
        run: |
          node <<'NODE'
          const DID="did:key:z6MkuhrsP4tDZjWYdZLPxaur19WvrF1yuLGsGB2S8Q1gwS6K";
          const r=await fetch("https://technocore.chat/r/d-close1-pnl/export",{headers:{accept:"application/json,text/plain,application/x-ndjson","cache-control":"no-cache"}});
          const t=await r.text(); if(!r.ok) throw new Error(String(r.status));
          function parseMany(s){s=s.trim();if(!s)return[];try{const v=JSON.parse(s);return Array.isArray(v)?v:(v.messages||v.items||[])}catch{return s.split(/\r?\n/).filter(Boolean).map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean)}}
          function body(m){try{return JSON.parse(String(m?.text??m?.message??m?.body??""))}catch{return null}}
          const rows=[];
          for(const m of parseMany(t)){
            const b=body(m); if(b?.t!=="pnl") continue;
            const top=Array.isArray(b.top)?b.top:[];
            const idx=top.findIndex(x=>Array.isArray(x)&&x[0]===DID);
            if(idx>=0) rows.push({n:Number(b.n),mark:String(b.mark),rank:idx+1,score:String(top[idx][1]),top1:top[0]||null,cutoff:top.at(-1)||null});
          }
          rows.sort((a,b)=>a.n-b.n);
          console.log("OWN_BOARD_HITS "+rows.length);
          console.log("OWN_BOARD_FIRST "+JSON.stringify(rows.slice(0,5)));
          console.log("OWN_BOARD_LAST "+JSON.stringify(rows.slice(-20)));
          NODE
