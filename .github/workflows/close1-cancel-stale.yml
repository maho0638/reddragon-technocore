name: Cancel stale Close-1 trader
on:
  push:
    branches: [diag/close1-room-20261001]
    paths:
      - ".github/workflows/close1-cancel-stale.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale trader run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 36853316899 --repo "${{ github.repository }}"
