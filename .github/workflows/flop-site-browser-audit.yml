name: FLOP full-site browser acceptance audit
on:
  push:
    branches:
      - qa/flop-site-browser-20261110
    paths:
      - ".github/workflows/flop-site-browser-audit.yml"
      - "scripts/browser/site-acceptance.spec.mjs"
      - "scripts/browser/flop-ui.spec.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flop-site-browser-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned browser test runtime (temporary runner only)
        run: npm install --no-save --no-package-lock playwright@1.65.0
      - name: Install Chromium in runner
        run: npx playwright install --with-deps chromium
      - name: Existing source and regression tests
        run: npm test
      - name: Offline mocked desktop and mobile Playwright flows
        run: node --test scripts/browser/flop-ui.spec.mjs
      - name: Live production read-only acceptance and intercepted write flows
        run: node --test scripts/browser/site-acceptance.spec.mjs
        env:
          NODE_OPTIONS: --no-warnings
