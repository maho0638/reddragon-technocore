name: Close-1 Trader Watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/close1-watchdog.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Close-1 RedDragon Trader"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: close1-trader-watchdog
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check trader health and self-restart
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRADER_WORKFLOW: close1-trader.yml
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO"
          auth=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          now="$(date -u +%s)"
          lock_epoch="$(date -u -d '2026-10-04T09:00:00Z' +%s)"
          if [[ "$now" -ge "$lock_epoch" ]]; then
            echo "Contest locked; watchdog stopping."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            echo "Trader cycle completed; dispatching next 5-minute loop cycle."
            curl -fsSL -X POST "${auth[@]}" \
              "$api/actions/workflows/$TRADER_WORKFLOW/dispatches" \
              -d '{"ref":"main"}'
            exit 0
          fi

          runs="$(curl -fsSL "${auth[@]}" "$api/actions/workflows/$TRADER_WORKFLOW/runs?per_page=12")"

          count="$(jq '.workflow_runs | length' <<<"$runs")"
          if [[ "$count" -eq 0 ]]; then
            echo "No trader runs found; dispatching recovery run."
            curl -fsSL -X POST "${auth[@]}"               "$api/actions/workflows/$TRADER_WORKFLOW/dispatches"               -d '{"ref":"main"}'
            exit 0
          fi

          latest_id="$(jq -r '.workflow_runs[0].id' <<<"$runs")"
          latest_status="$(jq -r '.workflow_runs[0].status' <<<"$runs")"
          latest_conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$runs")"
          latest_created="$(jq -r '.workflow_runs[0].created_at' <<<"$runs")"
          created_epoch="$(date -u -d "$latest_created" +%s)"
          age=$(( now - created_epoch ))

          consecutive_bad=0
          while IFS=$'\t' read -r status conclusion; do
            if [[ "$status" != "completed" ]]; then
              continue
            fi
            if [[ "$conclusion" == "success" ]]; then
              break
            fi
            if [[ "$conclusion" != "cancelled" ]]; then
              consecutive_bad=$((consecutive_bad + 1))
            fi
          done < <(jq -r '.workflow_runs[] | [.status, (.conclusion // "")] | @tsv' <<<"$runs")

          echo "latest_id=$latest_id status=$latest_status conclusion=$latest_conclusion age_s=$age consecutive_bad=$consecutive_bad"

          if [[ "$latest_status" != "completed" ]]; then
            echo "Trader run already active."
            exit 0
          fi

          if [[ "$consecutive_bad" -ge 3 ]]; then
            echo "::error::Trader has 3 consecutive hard failures. Watchdog will not mutate strategy code."
            exit 1
          fi

          echo "No active trader run; dispatching the next continuous cycle."
          curl -fsSL -X POST "${auth[@]}"             "$api/actions/workflows/$TRADER_WORKFLOW/dispatches"             -d '{"ref":"main"}'
